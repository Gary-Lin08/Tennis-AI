name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  smoke-script-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate script syntax
        run: python -m py_compile ai/backend/smoke_api_check.py

      - name: Smoke script help
        run: python ai/backend/smoke_api_check.py --help
