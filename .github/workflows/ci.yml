name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-script-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate script syntax
        run: python -m py_compile ai/backend/smoke_api_check.py

      - name: Smoke script help
        run: python ai/backend/smoke_api_check.py --help

      - name: Validate required docs exist
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "README.md",
              "docs/architecture.md",
              "docs/architecture-overview.md",
              "docs/integration-playbook.md",
              "ai/backend/smoke_api_check.py",
          ]

          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          print("All required baseline files exist.")
          PY
